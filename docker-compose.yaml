version: '3.8'

# ── Shared Airflow configuration (YAML anchor) ────────────────────────────────
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.2
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Dev-only fernet key — generate a real one for production:
    #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfdstA="
    AIRFLOW__WEBSERVER__SECRET_KEY: "bionicpro-dev-secret"
    # Connections injected via env (no manual UI setup required)
    AIRFLOW_CONN_BIONICPRO_POSTGRES: postgresql://bionicpro_user:bionicpro_password@app_db:5432/bionicpro
    AIRFLOW_CONN_BIONICPRO_CRM_DB: postgresql://crm_user:crm_password@crm_db:5432/crm
    # Extra Python packages installed at startup
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-postgres requests"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
  depends_on:
    - airflow_db
    - app_db
    - crm_db
    - clickhouse

services:
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
    ports:
      - "389:389"
    command: --copy-service

  app_db:
    image: postgres:14
    environment:
      POSTGRES_DB: bionicpro
      POSTGRES_USER: bionicpro_user
      POSTGRES_PASSWORD: bionicpro_password
    volumes:
      - ./postgres-app-data:/var/lib/postgresql/data
      # Telemetry schema + seed data — runs once on first container start
      - ./init-scripts/app_db_init.sql:/docker-entrypoint-initdb.d/01_app_db_init.sql
    ports:
      - "5434:5432"

  # ── CRM database (PostgreSQL simulating Oracle CRM DB) ──────────────────────
  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    # wal_level=logical is required for Debezium CDC (logical replication slot).
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./postgres-crm-data:/var/lib/postgresql/data
      # CRM schema (customers, orders, service_history) + seed data
      - ./init-scripts/crm_db_init.sql:/docker-entrypoint-initdb.d/01_crm_db_init.sql
    ports:
      - "5435:5432"

  # ── ClickHouse — OLAP data mart ──────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP API  (used by Airflow DAG and Reports API)
      - "9000:9000"   # Native TCP client (optional, for clickhouse-client CLI)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Kafka Engine tables + Materialized Views — executed on first container start
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── Zookeeper — Kafka coordination service ───────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./zookeeper-data:/var/lib/zookeeper/data
      - ./zookeeper-logs:/var/lib/zookeeper/log

  # ── Kafka — message broker for CDC events ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./kafka-data:/var/lib/kafka/data

  # ── Kafka Connect (Debezium) — CDC connector runtime ─────────────────────────
  kafka-connect:
    image: quay.io/debezium/connect:2.7
    depends_on:
      - kafka
      - crm_db
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-group
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # JSON without schema — produces flat records after ExtractNewRecordState SMT
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  # ── connector-init — registers Debezium connector once on startup ─────────────
  connector-init:
    image: curlimages/curl:8.6.0
    depends_on:
      - kafka-connect
    volumes:
      - ./debezium:/debezium:ro
    entrypoint: ["/bin/sh", "/debezium/register.sh"]
    restart: "no"

  # ── Airflow metadata database ─────────────────────────────────────────────────
  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - ./postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  # ── Airflow: one-time DB init + admin user creation ──────────────────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        pip install apache-airflow-providers-postgres requests --quiet &&
        airflow db upgrade &&
        airflow users create --username admin --password admin --firstname Admin --lastname BionicPRO --role Admin --email admin@bionicpro.com
      "
    restart: "no"

  # ── Airflow Scheduler ─────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      - airflow-init
      - airflow_db
      - app_db
      - crm_db
      - clickhouse

  # ── Airflow Webserver ─────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8082:8080"
    restart: unless-stopped
    depends_on:
      - airflow-init
      - airflow_db

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: reports-frontend
      AUTH_REDIRECT_URI: http://localhost:8001/auth/callback
      FRONTEND_URL: http://localhost:3000
      API_URL: http://api:8000
      SESSION_LIFETIME: "1800"
      COOKIE_SECURE: "false"
      DATABASE_URL: postgres://bionicpro_user:bionicpro_password@app_db:5432/bionicpro
    depends_on:
      - keycloak
      - app_db

  # ── PDF Service — рендеринг PDF (@react-pdf/renderer, Node.js) ──────────────
  # Внутренний сервис: принимает UserReport JSON от reports-api, возвращает PDF.
  # Не экспонируется через BFF — вызывается только из reports-api.
  pdf-service:
    build:
      context: ./pdf-service
      dockerfile: Dockerfile
    environment:
      PORT: "5501"

  # ── MinIO — S3-compatible object storage for PDF cache ──────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"   # S3 API (9000 is taken by ClickHouse native TCP)
      - "9001:9001"   # MinIO Console
    volumes:
      - ./minio-data:/data

  # ── Nginx CDN — reverse proxy in front of MinIO with static file caching ────
  cdn:
    image: nginx:alpine
    ports:
      - "9080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio

  # ── Reports API — бэкенд отчётов (Go, читает ClickHouse) ────────────────────
  api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CLICKHOUSE_URL: http://clickhouse:8123
      FRONTEND_URL: http://localhost:3000
      PDF_SERVICE_URL: http://pdf-service:5501
      S3_ENDPOINT: minio:9000
      S3_BUCKET: reports
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CDN_URL: http://localhost:9080
    depends_on:
      - clickhouse
      - pdf-service
      - minio
      - cdn

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8001
    depends_on:
      - bionicpro-auth

volumes:
  clickhouse_data:
