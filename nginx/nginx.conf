proxy_cache_path /var/cache/nginx
    levels=1:2
    keys_zone=s3_cache:10m
    max_size=2g
    inactive=30d
    use_temp_path=off;

server {
    listen 80;

    location / {
        proxy_pass       http://minio:9000;
        proxy_set_header Host minio:9000;

        # Versioned URLs (v1.pdf, v2.pdf, …) are immutable once written to S3.
        # Cache invalidation is handled by bumping the version number in the
        # "latest" pointer — the old versioned URL is simply never requested again
        # and is evicted by the "inactive" timer. No purge module needed.
        proxy_cache            s3_cache;
        proxy_cache_valid      200 365d;
        proxy_cache_use_stale  error timeout updating;
        proxy_cache_lock       on;

        add_header X-Cache-Status $upstream_cache_status;
    }
}
